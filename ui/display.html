<!doctype html>

<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamsungF display</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; }
  body { margin: 0; background: #111316; color: #f4f5f7; }
  header { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem;
           border-bottom: 1px solid #2b2e34; }
  h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  .detail { color: #a8aeb8; font-size: .85rem; margin-top: .2rem; }
  #status { margin-left: auto; color: #86d7ad; }
  button { font: inherit; padding: .45rem .8rem; border: 1px solid #454b56;
           color: inherit; background: #22262d; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; place-items: center; padding: 1rem; }
  img { display: block; max-width: 100%; max-height: calc(100vh - 7.5rem);
        background: black; box-shadow: 0 0 0 1px #2b2e34; }
  nav { padding: 0 1rem 1rem; text-align: center; }
  nav button { margin: .25rem; }
</style>
<header>
  <div><h1>Samsung UE40F6650</h1><div class="detail">Framebuffer diagnostic</div></div>
  <span id="status">Connecting</span><button id="stop">Stop TV</button>
</header>
<main><img id="screen" alt="Live emulated TV framebuffer"></main>
<nav id="remote" hidden>
  <button data-key="121">Smart Hub</button><button data-key="26">Menu</button>
  <button data-key="96">Up</button><button data-key="97">Down</button>
  <button data-key="101">Left</button><button data-key="98">Right</button>
  <button data-key="104">Enter</button><button data-key="88">Back</button>
  <button data-key="45">Exit</button>
</nav>
<script>
  const screen = document.querySelector('#screen');
  const status = document.querySelector('#status');
  const stop = document.querySelector('#stop');
  let running = true, previous;
  document.querySelectorAll('[data-key]').forEach(button => {
    button.onclick = async () => {
      button.disabled = true;
      try {
        const response = await fetch('/remote', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({key: Number(button.dataset.key)})});
        if (!response.ok) status.textContent = 'Remote unavailable';
      } catch { status.textContent = 'Remote unavailable'; }
      button.disabled = false;
    };
  });
  async function refresh() {
    if (!running) return;
    try {
      const response = await fetch('/screen.png', {cache: 'no-store'});
      if (!response.ok) throw new Error('Disconnected');
      const next = URL.createObjectURL(await response.blob());
      screen.src = next;
      if (previous) URL.revokeObjectURL(previous);
      previous = next;
      status.textContent = 'Live';
    } catch {
      status.textContent = 'Disconnected';
    }
    if (running) setTimeout(refresh, 750);
  }
  stop.onclick = async () => {
    running = false;
    stop.disabled = true;
    try { await fetch('/stop', {method: 'POST'}); } catch {}
    status.textContent = 'Stopped';
  };
  refresh();
</script>
</html>
